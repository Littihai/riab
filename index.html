<!doctype html>
<html lang="th" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>riab</title>
    <meta
      name="description"
      content="riab: a free, themeable React UI starter. White-minimal style, design tokens, dark mode, Thai/English, customizable appearance."
    />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Social preview: set og:url and og:image to your own deployed absolute URLs -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="riab" />
    <meta
      property="og:description"
      content="A free, themeable React UI starter: tokens, dark mode, Thai/English, Customize."
    />
    <meta property="og:url" content="https://littihai.github.io/riab/" />
    <meta property="og:image" content="https://littihai.github.io/riab/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // apply the saved theme and language before first paint (no flash)
      try {
        var t = localStorage.getItem("riab.theme");
        var dark = t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (localStorage.getItem("riab.lang") === "en") document.documentElement.lang = "en";
        var a = JSON.parse(localStorage.getItem("riab.app") || "{}");
        var legacy = { clay: "amber", pine: "green" };
        var acc = legacy[a.accent] || a.accent;
        if (acc && acc !== "ink") document.documentElement.dataset.accent = acc;
        if (a.base && a.base !== "zinc") document.documentElement.dataset.base = a.base;
        if (a.font && a.font !== "inter") document.documentElement.dataset.font = a.font;
        if (a.radius && a.radius !== "soft") document.documentElement.dataset.radius = a.radius;
        if (a.density && a.density !== "comfortable") document.documentElement.dataset.density = a.density;
        if (a.icons === "color") document.documentElement.dataset.icons = "color";
        if (a.motion === "reduce") document.documentElement.dataset.motion = "reduce";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
